[package]
name = "folio_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "folio_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
# Fork = upstream typst + 6 lines exposing `Bibliography::load` and
# `FirstLineIndent::new` for embedders. Once upstreamed, switch back to
# `github.com/typst/typst` and drop the fork.
typst         = { git = "https://github.com/dannote/typst", rev = "452eba4e4" }
typst-library = { git = "https://github.com/dannote/typst", rev = "452eba4e4" }
typst-layout  = { git = "https://github.com/dannote/typst", rev = "452eba4e4" }
typst-pdf     = { git = "https://github.com/dannote/typst", rev = "452eba4e4" }
typst-svg     = { git = "https://github.com/dannote/typst", rev = "452eba4e4" }
typst-render  = { git = "https://github.com/dannote/typst", rev = "452eba4e4" }
typst-syntax  = { git = "https://github.com/dannote/typst", rev = "452eba4e4" }
typst-eval    = { git = "https://github.com/dannote/typst", rev = "452eba4e4" }
typst-assets  = { git = "https://github.com/typst/typst-assets", rev = "57a38ca", features = ["fonts"] }
comrak = { version = "0.52", default-features = false }
ecow = "0.2"
hayagriva = "0.9.1"
smallvec = { version = "1.11", features = ["union", "const_generics", "const_new"] }
typed-arena = "2.0"
fontdb = "0.23"

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
