[package]
name = "folio_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "folio_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
# Upstream typst.
#
# Pinned to 5187e083, which is the upstream commit the fork this used to track
# was branched from — same API surface, no fork. Note this is a `main` commit
# rather than a release tag: it is newer than v0.14.2, whose `World` API differs.
#
# This used to track a fork that made `Bibliography::load` and
# `FirstLineIndent::new` public, because the old struct-building path
# constructed those types directly from the embedder. Those bumps are still not
# in an upstream release (`fn load` is private in v0.14.2), so the fork was not
# obsolete — it is simply no longer needed: reaching Typst through its
# evaluator, `#bibliography(..)` and `#set par(first-line-indent: ..)` are
# ordinary Typst functions.
typst         = { git = "https://github.com/typst/typst", rev = "5187e083" }
typst-library = { git = "https://github.com/typst/typst", rev = "5187e083" }
typst-layout  = { git = "https://github.com/typst/typst", rev = "5187e083" }
typst-pdf     = { git = "https://github.com/typst/typst", rev = "5187e083" }
typst-assets  = { git = "https://github.com/typst/typst-assets", rev = "57a38ca", features = ["fonts"] }

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
